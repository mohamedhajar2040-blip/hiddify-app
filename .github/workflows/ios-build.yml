
name: iOS IPA Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Install iOS dependencies
        run: make ios-install-deps

      - name: Prepare iOS
        run: make ios-prepare

      - name: Build iOS release
        run: make ios-release
